name: ci

# The daily refresh itself runs from the profile repo (juanplazadev/juanplazadev), on the
# VPS runner; see DEPLOY.md. This workflow only tests the generator.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        run: docker compose build test

      - name: Run tests
        run: docker compose run --rm test
